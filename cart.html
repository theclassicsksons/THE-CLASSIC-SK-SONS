
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopping Cart | THE CLASSIC SK & SONS</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0d0d0d;
    color: #fff;
}

header {
    background: #171717;
    padding: 22px;
    text-align: center;
    border-bottom: 2px solid #d4af37;
}

header h1 {
    color: #d4af37;
    margin: 0 0 10px;
}

a {
    color: #d4af37;
    text-decoration: none;
}

main {
    max-width: 1000px;
    margin: 30px auto;
    padding: 15px;
}

.cart-item {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 18px 0;
    border-bottom: 1px solid #444;
}

.cart-item img {
    width: 100px;
    height: 120px;
    object-fit: cover;
    border-radius: 5px;
}

.details {
    flex: 1;
}

.details h3 {
    margin: 0 0 10px;
}

.price {
    color: #d4af37;
    font-weight: bold;
}

button {
    padding: 9px 13px;
    margin: 4px;
    border: 1px solid #d4af37;
    background: transparent;
    color: #d4af37;
    cursor: pointer;
    border-radius: 4px;
}

button:hover {
    background: #d4af37;
    color: #111;
}

.remove {
    border-color: #e57373;
    color: #e57373;
}

.summary {
    margin-top: 25px;
    padding: 22px;
    background: #191919;
    border: 1px solid #444;
    border-radius: 8px;
    text-align: right;
}

.summary h2 {
    color: #d4af37;
}

.empty {
    text-align: center;
    padding: 40px 10px;
}

@media (max-width: 600px) {
    .cart-item {
        align-items: flex-start;
        flex-wrap: wrap;
    }

    .cart-item img {
        width: 80px;
        height: 100px;
    }

    .summary {
        text-align: center;
    }
}
</style>
</head>

<body>

<header>
    <h1>THE CLASSIC SK &amp; SONS</h1>
    <p>YOUR SHOPPING CART</p>
    <a href="index.html">← Continue Shopping</a>
</header>

<main>
    <div id="cartItems"></div>

    <div class="summary" id="summary" hidden>
        <p>Total Items: <strong id="itemCount">0</strong></p>
        <h2>Total: ₹<span id="total">0</span></h2>
        <button onclick="checkout()">Proceed to Checkout</button>
        <button onclick="clearCart()">Clear Cart</button>
    </div>
</main>

<script>
const CART_KEY = "classicSKCart";

function getCart() {
    try {
        return JSON.parse(localStorage.getItem(CART_KEY)) || [];
    } catch {
        return [];
    }
}

function saveCart(cart) {
    localStorage.setItem(CART_KEY, JSON.stringify(cart));
}

function formatPrice(price) {
    return Number(price).toLocaleString("en-IN", {
        maximumFractionDigits: 2
    });
}

function renderCart() {
    const cart = getCart();
    const container = document.getElementById("cartItems");
    const summary = document.getElementById("summary");

    if (cart.length === 0) {
        container.innerHTML = `
            <div class="empty">
                <h2>Your cart is empty</h2>
                <p>Add some products to get started.</p>
                <a href="index.html">Explore Collection</a>
            </div>`;
        summary.hidden = true;
        return;
    }

    summary.hidden = false;

    container.innerHTML = cart.map((item, index) => `
        <div class="cart-item">
            <img src="${escapeHTML(item.image || "")}"
                 alt="${escapeHTML(item.name)}"
                 onerror="this.style.display='none'">

            <div class="details">
                <h3>${escapeHTML(item.name)}</h3>
                <p class="price">₹${formatPrice(item.price)} each</p>

                <button onclick="changeQty(${index}, -1)">−</button>
                <strong>${item.qty}</strong>
                <button onclick="changeQty(${index}, 1)">+</button>

                <p>Subtotal: ₹${formatPrice(item.price * item.qty)}</p>
                <button class="remove"
                        onclick="removeItem(${index})">Remove</button>
            </div>
        </div>
    `).join("");

    const count = cart.reduce((sum, item) => sum + item.qty, 0);
    const total = cart.reduce(
        (sum, item) => sum + item.price * item.qty, 0
    );

    document.getElementById("itemCount").textContent = count;
    document.getElementById("total").textContent = formatPrice(total);
}

function escapeHTML(value) {
    return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[char]);
}

function changeQty(index, amount) {
    const cart = getCart();

    if (!cart[index]) return;

    cart[index].qty += amount;

    if (cart[index].qty <= 0) {
        cart.splice(index, 1);
    }

    saveCart(cart);
    renderCart();
}

function removeItem(index) {
    const cart = getCart();
    cart.splice(index, 1);
    saveCart(cart);
    renderCart();
}

function clearCart() {
    if (confirm("Are you sure you want to clear your cart?")) {
        saveCart([]);
        renderCart();
    }
}

function checkout() {
    alert("Thank you for shopping with The Classic SK & Sons! Your order has been confirmed.");
}

renderCart();
</script>

</body>
</html>
